    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/notiflix@3.2.7/dist/notiflix-aio-3.2.7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // Example starter JavaScript for disabling form submissions if there are invalid fields
    (() => {
      'use strict'

      // Fetch all the forms we want to apply custom Bootstrap validation styles to
      const forms = document.querySelectorAll('.needs-validation')

      // Loop over them and prevent submission
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }

          form.classList.add('was-validated')
        }, false)
      })
    })()

    const Prompt = () => {
      const toast = (c) => {
        const {
          msg = "",
          position = "top-end",
          icon = "success"
        } = c;
        console.log(icon)
        const Toast = Swal.mixin({
          toast: true,
          title: msg,
          position: position,
          iconColor: 'green',
          icon: icon,
          customClass: {
            popup: 'colored-toast',
          },
          showConfirmButton: false,
          timer: 1500,
          timerProgressBar: true,
        })
        Toast.fire({})
      }

      const success = (c) => {
        const {
          msg = "Success!",
          title = "",
          footer = ""
        } = c;
        Swal.fire({
          icon: "success",
          title: title,
          text: msg,
          footer: footer
        });
      }
      const error = (c) => {
        const {
          msg = "Error occurred",
          title = "",
          footer = ""
        } = c;
        Swal.fire({
          icon: "error",
          title: title,
          text: msg,
          footer: footer
        });

      }

      const notify = (msgType, msg) => {
        notifications = {
          success: Notiflix.Notify.success,
          error: Notiflix.Notify.error,
          warning: Notiflix.Notify.warning
        }
        if (notifications[msgType] != undefined) {
          notifications[msgType](msg)
        }
      } 
      const custom = async (c) => {
        const {
          msg = "",
          title = ""
        } = c
        const { value: formValues } = await Swal.fire({
          title: title,
          html: msg,
          focusConfirm: false,
          showCancelButton: true,
          willOpen: () => {
            const elem = document.getElementById('reservation-dates-modal');
            const rp = new DateRangePicker(elem, {
              showOnFocus: true,
              container: 'body'
            })
          },
          didOpen: () => {
            document.getElementById("start").removeAttribute("disabled"),
            document.getElementById("end").removeAttribute("disabled")
          },
          preConfirm: () => {
            return [
              document.getElementById("start").value,
              document.getElementById("end").value
            ];
          }
        });
        if (formValues) Swal.fire(JSON.stringify(formValues));
      }

      return {
        toast,
        notify,
        success,
        error,
        custom
      }
    }

    const attention = Prompt()

    const btn = document.getElementById("colorButton")
    btn.addEventListener(
      "click", () => {
        const html = `
        <form id="check-availability-form" action="" class="needs-validation", method="post">
            <div class="row">
              <div class="col">
                <div class="row" id="reservation-dates-modal">
                  <div class="col">
                    <input disabled required class="form-control" type="text" name="start" id="start" placeholder="Arrival">
                  </div>
                  <div class="col">
                    <input disabled required class="form-control" type="text" name="end" id="end" placeholder="Departure">
                  </div> 
                </div
              </div>
            </div>
        </form>
        `
        attention.custom({ msg: html, title: "Choose your dates" })
      }
    )
    const elem = document.getElementById('reservation-dates');
    console.log(elem)
    const rangepicker = new DateRangePicker(elem, {
      showOnFocus: true,
      container: 'body'
    });

  </script>
